<!-- @dsCard group="Brand" viewport="700x260" name="Content-type language" subtitle="Four kinds of content, four unmistakable treatments" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--paper-50)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">
<div class="cm-post" style="padding:14px;display:flex;flex-direction:column;gap:8px"><span class="cm-overline">Member post</span><div style="font:var(--text-body-s);color:var(--ink-800)">Paper card, hairline border, avatar + source + audience label.</div></div>
<div class="cm-post cm-post--official" style="display:flex;flex-direction:column"><div class="cm-post__flag">Official</div><div style="padding:12px 14px;font:var(--text-body-s);color:var(--ink-800)">Blue flag band, seal on avatar, serif headline, 3px halo.</div></div>
<div class="cm-post cm-post--committee" style="display:flex;flex-direction:column"><div class="cm-post__flag cm-post__flag--private">Private</div><div style="padding:12px 14px;font:var(--text-body-s);color:var(--ink-800)">Sunken paper, dashed ink border, lock. Never shareable.</div></div>
<div class="cm-issue" style="gap:6px"><span class="cm-issue__id">CASE-2041</span><div style="font:var(--text-body-s);color:var(--ink-800)">Issue: mono ID, status first, next action + deadline. Never in the feed.</div></div>
</div></body></html>
