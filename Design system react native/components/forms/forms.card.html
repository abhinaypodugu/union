<!-- @dsCard group="Components" viewport="700x330" name="Forms" subtitle="Field, Input, Textarea, Select, Checkbox, Radio, Switch" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{padding:20px;background:var(--paper-50)}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.col{display:flex;flex-direction:column;gap:14px}.lbl{font:500 11px/1 var(--font-mono);color:var(--ink-500);width:72px;flex:none}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../guidelines/ds-loader.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
DS.ready.then((NS) => {
const { Field, Input, Textarea, Select, Checkbox, Radio, Switch } = NS;
function Demo() {
const [on, setOn] = React.useState(true);
return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18}}>
 <div className="col">
  <Field label="Title" required hint="A short summary members will recognise."><Input placeholder="Unpaid overtime for night shift" /></Field>
  <Field label="Search"><Input icon="search" placeholder="Search members" /></Field>
  <Field label="Employer" error="Enter the employer name"><Input invalid defaultValue="" /></Field>
 </div>
 <div className="col">
  <Field label="Category"><Select defaultValue="" placeholder="Choose a category" options={['Wages','Working hours','Safety','Harassment (confidential)']} /></Field>
  <Field label="Description"><Textarea rows={2} placeholder="What happened?" /></Field>
  <div className="row" style={{gap:18}}><Checkbox defaultChecked label="Affects others" /><Radio name="r" defaultChecked label="Appoint" /><Radio name="r" label="Nominate" /><Switch checked={on} onChange={e => setOn(e.target.checked)} label="Notify" /></div>
 </div>
</div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
});
</script></body></html>
