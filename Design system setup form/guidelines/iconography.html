<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--paper-50)}</style></head><body><div id="g" style="display:grid;grid-template-columns:repeat(14,1fr);gap:14px 8px;color:var(--ink-800)"></div><script>['house','users-round','circle-alert','bell','network','megaphone','badge-check','lock','pin','heart','message-circle','share-2','inbox','chevrons-up','timer','triangle-alert','circle-check','map-pin','briefcase','users','landmark','globe','building-2','user-check','shield','history','paperclip','search'].forEach(n=>{const d=document.createElement('div');d.style.cssText='display:flex;flex-direction:column;align-items:center;gap:5px';d.innerHTML='<img src="../assets/icons/'+n+'.svg" width="22" height="22" style="opacity:.85"><span style="font:500 9px/1 var(--font-mono);color:var(--ink-500);white-space:nowrap;overflow:hidden;max-width:46px;text-overflow:ellipsis">'+n+'</span>';g.appendChild(d)})</script></body></html>
