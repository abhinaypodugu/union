<!-- @dsCard group="Colors" viewport="700x180" name="Semantic surfaces" subtitle="Content-type surfaces: card, sunken, official, private, inverse" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--paper-50)}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px"><div style="padding:14px;border-radius:10px;background:var(--surface-card);border:1px solid var(--paper-200);display:flex;flex-direction:column;gap:4px"><div style="font:600 14px/1.2 var(--font-sans);color:var(--text-primary)">Card</div><div style="font:500 11px/1.3 var(--font-mono);color:var(--ink-500)">--surface-card</div></div><div style="padding:14px;border-radius:10px;background:var(--bg-sunken);border:1px solid var(--paper-200);display:flex;flex-direction:column;gap:4px"><div style="font:600 14px/1.2 var(--font-sans);color:var(--text-primary)">Sunken</div><div style="font:500 11px/1.3 var(--font-mono);color:var(--ink-500)">--bg-sunken</div></div><div style="padding:14px;border-radius:10px;background:var(--official-bg);border:1px solid var(--official-border);display:flex;flex-direction:column;gap:4px"><div style="font:600 14px/1.2 var(--font-sans);color:var(--official-fg)">Official announcement</div><div style="font:500 11px/1.3 var(--font-mono);color:var(--ink-500)">--official-*</div></div><div style="padding:14px;border-radius:10px;background:var(--surface-private);border:1px dashed var(--private-border);display:flex;flex-direction:column;gap:4px"><div style="font:600 14px/1.2 var(--font-sans);color:var(--private-fg)">Committee-private</div><div style="font:500 11px/1.3 var(--font-mono);color:var(--ink-500)">--surface-private · dashed</div></div><div style="padding:14px;border-radius:10px;background:var(--surface-selected);border:1px solid var(--blue-200);display:flex;flex-direction:column;gap:4px"><div style="font:600 14px/1.2 var(--font-sans);color:var(--text-accent)">Selected row</div><div style="font:500 11px/1.3 var(--font-mono);color:var(--ink-500)">--surface-selected</div></div><div style="padding:14px;border-radius:10px;background:var(--surface-inverse);display:flex;flex-direction:column;gap:4px"><div style="font:600 14px/1.2 var(--font-sans);color:var(--paper-0)">Inverse</div><div style="font:500 11px/1.3 var(--font-mono);color:var(--ink-400)">--surface-inverse</div></div></div></body></html>
