<!-- @dsCard group="Colors" viewport="700x120" name="Status hues" subtitle="Matched lightness & chroma; used only for workflow meaning" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;background:var(--paper-50)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px"><div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;height:56px;border-radius:8px;overflow:hidden;border:1px solid var(--green-border)"><div style="flex:1;background:var(--green-bg)"></div><div style="flex:1;background:var(--green-solid)"></div></div><div style="font:600 12px/1.2 var(--font-sans);color:var(--green-fg)">Success · resolved</div><div style="font:500 11px/1.2 var(--font-mono);color:var(--ink-500)">--green-*</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;height:56px;border-radius:8px;overflow:hidden;border:1px solid var(--amber-border)"><div style="flex:1;background:var(--amber-bg)"></div><div style="flex:1;background:var(--amber-solid)"></div></div><div style="font:600 12px/1.2 var(--font-sans);color:var(--amber-fg)">Warning · waiting / due soon</div><div style="font:500 11px/1.2 var(--font-mono);color:var(--ink-500)">--amber-*</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;height:56px;border-radius:8px;overflow:hidden;border:1px solid var(--red-border)"><div style="flex:1;background:var(--red-bg)"></div><div style="flex:1;background:var(--red-solid)"></div></div><div style="font:600 12px/1.2 var(--font-sans);color:var(--red-fg)">Danger · overdue / rejected</div><div style="font:500 11px/1.2 var(--font-mono);color:var(--ink-500)">--red-*</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;height:56px;border-radius:8px;overflow:hidden;border:1px solid var(--violet-border)"><div style="flex:1;background:var(--violet-bg)"></div><div style="flex:1;background:var(--violet-solid)"></div></div><div style="font:600 12px/1.2 var(--font-sans);color:var(--violet-fg)">Escalated</div><div style="font:500 11px/1.2 var(--font-mono);color:var(--ink-500)">--violet-*</div></div></div></body></html>
