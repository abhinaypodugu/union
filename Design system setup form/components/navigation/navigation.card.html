<!-- @dsCard group="Components" viewport="700x400" name="Navigation" subtitle="Tabs, SegmentedControl, TabBar (mobile), SideNav (admin)" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{padding:20px;background:var(--paper-50)}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.col{display:flex;flex-direction:column;gap:14px}.lbl{font:500 11px/1 var(--font-mono);color:var(--ink-500);width:72px;flex:none}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../guidelines/ds-loader.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
DS.ready.then((NS) => {
const { Tabs, SegmentedControl, TabBar, SideNav } = NS;
function Demo() {
const [t, setT] = React.useState('assigned'); const [f, setF] = React.useState('For you'); const [m, setM] = React.useState('home'); const [s, setS] = React.useState('queue');
return <div style={{display:'grid',gridTemplateColumns:'220px 1fr',gap:20}}>
 <div style={{height:360,borderRadius:12,overflow:'hidden',border:'1px solid var(--paper-200)'}}><div style={{transform:'scale(.89)',transformOrigin:'top left',width:248}}><SideNav org={{name:'Telangana Workers Fed.',scope:'State admin'}} value={s} onChange={setS} sections={[{heading:'Work',items:[{value:'overview',label:'Overview',icon:'layout-dashboard'},{value:'queue',label:'Issue queue',icon:'inbox',badge:24},{value:'esc',label:'Escalations',icon:'chevrons-up',badge:3,alert:true}]},{heading:'Structure',items:[{value:'org',label:'Organization',icon:'network'},{value:'com',label:'Committees',icon:'users'}]}]} /></div></div>
 <div className="col">
  <Tabs value={t} onChange={setT} items={[{label:'Assigned to me',value:'assigned',count:8},{label:'Committee queue',value:'queue',count:24},{label:'Overdue',value:'over',count:3},{label:'Closed',value:'closed'}]} />
  <SegmentedControl block value={f} onChange={setF} items={['For you','My groups','Announcements']} />
  <div style={{marginTop:'auto',width:390,border:'1px solid var(--paper-200)',borderRadius:12,overflow:'hidden'}}><TabBar value={m} onChange={setM} items={[{value:'home',label:'Home',icon:'house'},{value:'groups',label:'Groups',icon:'users-round'},{value:'issues',label:'Issues',icon:'circle-alert'},{value:'alerts',label:'Alerts',icon:'bell',badge:3},{value:'org',label:'Organization',icon:'network'}]} /></div>
 </div>
</div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
});
</script></body></html>
