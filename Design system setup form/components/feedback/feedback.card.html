<!-- @dsCard group="Components" viewport="700x400" name="Feedback" subtitle="Dialog, Toast, Tooltip, Notice" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{padding:20px;background:var(--paper-50)}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.col{display:flex;flex-direction:column;gap:14px}.lbl{font:500 11px/1 var(--font-mono);color:var(--ink-500);width:72px;flex:none}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../guidelines/ds-loader.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
DS.ready.then((NS) => {
const { Dialog, Toast, Tooltip, Notice, Button, Field, Textarea, AudienceLabel } = NS;
function Demo() {
return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
 <div style={{position:'relative',height:360,borderRadius:12,overflow:'hidden',background:'var(--paper-100)'}}>
  <Dialog contained title="Escalate to state committee?" description="Telangana IT Workers Committee receives the full case history." onClose={() => {}} footer={<><Button variant="secondary" size="sm">Cancel</Button><Button size="sm" icon="chevrons-up">Escalate</Button></>}>
   <Field label="Reason" required><Textarea rows={2} defaultValue="Employer has not responded in 10 days." /></Field>
  </Dialog>
 </div>
 <div className="col">
  <Toast title="Issue submitted" description="Routed to Hyderabad IT Workers Committee" action="View" onClose={() => {}} />
  <Toast tone="danger" title="Couldn’t send — you’re offline" action="Retry" />
  <Notice tone="private" title="Private to you and assigned handlers">This issue won’t appear in any feed.</Notice>
  <Notice tone="danger" title="Platform admin override">Recorded as a platform action, not an organization appointment.</Notice>
  <div style={{paddingTop:30}}><Tooltip open content="Only committee members can see this"><AudienceLabel scope="committee" label="Committee only" /></Tooltip></div>
 </div>
</div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
});
</script></body></html>
