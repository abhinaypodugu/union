<!-- @dsCard group="Member app" viewport="480x940" name="Member app (mobile)" subtitle="Home feed, groups, issues, notifications, organization — click through" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Commons — Member app</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; background: var(--paper-150); }
  .app-scroll { scrollbar-width: none; }
  .app-scroll::-webkit-scrollbar { display: none; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../guidelines/ds-loader.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="Screens.jsx"></script>
<script type="text/babel">
function App() {
  const D = window.MEMBER_DATA;
  const [tab, setTab] = React.useState(() => localStorage.getItem('commons-member-tab') || 'home');
  const [issueId, setIssueId] = React.useState(null);
  const [profile, setProfile] = React.useState(false);
  const [raise, setRaise] = React.useState(false);
  const [issues, setIssues] = React.useState(D.issues);
  const [toast, setToast] = React.useState(null);
  const scroller = React.useRef(null);
  React.useEffect(() => { localStorage.setItem('commons-member-tab', tab); }, [tab]);
  React.useEffect(() => { if (scroller.current) scroller.current.scrollTop = 0; }, [tab, issueId, profile]);
  React.useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 4500); return () => clearTimeout(t); }, [toast]);

  const go = (where) => { setProfile(false); if (where === 'home') { setIssueId(null); setTab('home'); } else { setTab('issues'); setIssueId(where); } };
  const submit = (v) => {
    const id = 'CASE-' + (2093 + issues.length - 3);
    const committee = v.category.startsWith('Harassment') ? 'Confidential handlers · Telangana' : v.category === 'Facilities' ? 'Hyderabad General Committee' : 'Hyderabad IT Workers Committee';
    setIssues([{ id, title: v.title, status: 'submitted', category: v.category, location: 'Hyderabad', committee, nextAction: 'Committee acknowledges your issue', due: 'Within 2 days', opened: 'Today',
      stages: [{ name: committee, state: 'current', levelShort: 'L1', sub: 'City level · just submitted', events: [{ time: 'Today', text: 'Submitted and routed' }] }] }, ...issues]);
    setRaise(false); setTab('issues'); setIssueId(null);
    setToast({ title: 'Issue submitted', description: 'Routed to ' + committee, id });
  };
  const issue = issues.find((i) => i.id === issueId);
  const unreadAlerts = D.notifications.filter((n) => n.unread).length;

  let screen;
  if (profile) screen = <ProfileScreen onBack={() => setProfile(false)} />;
  else if (tab === 'home') screen = <HomeScreen onOpenProfile={() => setProfile(true)} />;
  else if (tab === 'groups') screen = <GroupsScreen />;
  else if (tab === 'issues') screen = issue ? <IssueDetail issue={issue} onBack={() => setIssueId(null)} onReply={() => setToast({ title: 'Reply sent', description: 'The committee has been notified' })} /> : <IssuesScreen issues={issues} onOpen={setIssueId} onRaise={() => setRaise(true)} />;
  else if (tab === 'alerts') screen = <AlertsScreen onGo={go} />;
  else screen = <OrgScreen />;

  return (
    <IOSDevice>
      <div style={{ position: 'relative', height: '100%', display: 'flex', flexDirection: 'column', background: 'var(--paper-50)' }}>
        <div ref={scroller} className="app-scroll" style={{ flex: 1, overflowY: 'auto', position: 'relative' }}>{screen}</div>
        <div style={{ '--safe-bottom': '22px' }}>
          <TabBar value={tab} onChange={(v) => { setProfile(false); setIssueId(null); setTab(v); }} items={[
            { value: 'home', label: 'Home', icon: 'house' },
            { value: 'groups', label: 'Groups', icon: 'users-round' },
            { value: 'issues', label: 'Issues', icon: 'circle-alert' },
            { value: 'alerts', label: 'Alerts', icon: 'bell', badge: unreadAlerts },
            { value: 'org', label: 'Organization', icon: 'network' }]} />
        </div>
        {raise && <RaiseSheet onClose={() => setRaise(false)} onSubmit={submit} />}
        {toast && <div style={{ position: 'absolute', left: 12, right: 12, bottom: 104, zIndex: 45, display: 'flex', justifyContent: 'center' }}><Toast title={toast.title} description={toast.description} action={toast.id ? 'View' : undefined} onAction={() => { setIssueId(toast.id); setToast(null); }} onClose={() => setToast(null)} /></div>}
      </div>
    </IOSDevice>
  );
}
DS.ready.then((NS) => { Object.assign(window, NS); ReactDOM.createRoot(document.getElementById('root')).render(<App />); });
</script>
</body>
</html>
