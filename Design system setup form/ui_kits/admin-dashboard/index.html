<!-- @dsCard group="Admin dashboard" viewport="1440x900" name="Admin dashboard (web)" subtitle="Overview, issue queue, committees, announcement composer — click through" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Commons — Admin dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>html, body, #root { height: 100%; } body { overflow: hidden; }</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../guidelines/ds-loader.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../member-app/data.jsx"></script>
<script type="text/babel" src="Screens.jsx"></script>
<script type="text/babel">
function Admin() {
  const [view, setView] = React.useState(() => localStorage.getItem('commons-admin-view') || 'overview');
  const [focus, setFocus] = React.useState(null);
  React.useEffect(() => { localStorage.setItem('commons-admin-view', view); }, [view]);
  const go = (v, id) => { setFocus(id || null); setView(v); };
  return (
    <div style={{ display: 'flex', height: '100%' }}>
      <SideNav org={AD.org} value={view} onChange={(v) => go(v)}
        sections={[
          { heading: 'Work', items: [{ value: 'overview', label: 'Overview', icon: 'layout-dashboard' }, { value: 'queue', label: 'Issue queue', icon: 'inbox', badge: 24 }, { value: 'esc', label: 'Escalations', icon: 'chevrons-up', badge: 3, alert: true }, { value: 'announce', label: 'Announcements', icon: 'megaphone' }] },
          { heading: 'Structure', items: [{ value: 'committees', label: 'Committees', icon: 'users' }, { value: 'members', label: 'Members', icon: 'users-round', badge: 9 }, { value: 'geo', label: 'Geography', icon: 'folder-tree' }] },
          { heading: 'Configure', items: [{ value: 'routing', label: 'Routing & escalation', icon: 'sliders-horizontal' }, { value: 'audit', label: 'Audit log', icon: 'history' }, { value: 'settings', label: 'Settings', icon: 'settings' }] },
        ]}
        footer={<div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 8px', font: '500 12px/1.3 var(--font-sans)', color: 'var(--text-muted)' }}><Icon name="shield-check" size={16} />Signed in with MFA</div>} />
      <main style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', background: 'var(--paper-50)', overflow: view === 'overview' ? 'auto' : 'hidden' }}>
        {view === 'overview' && <OverviewScreen go={go} />}
        {(view === 'queue' || view === 'esc') && <QueueScreen initial={focus} />}
        {view === 'committees' && <CommitteesScreen />}
        {view === 'announce' && <AnnounceScreen />}
        {!['overview', 'queue', 'esc', 'committees', 'announce'].includes(view) && (
          <div style={{ flex: 1, display: 'grid', placeItems: 'center', color: 'var(--text-muted)', font: 'var(--text-body)' }}>Not part of this UI kit yet.</div>
        )}
      </main>
    </div>
  );
}
DS.ready.then((NS) => { Object.assign(window, NS); ReactDOM.createRoot(document.getElementById('root')).render(<Admin />); });
</script>
</body>
</html>
